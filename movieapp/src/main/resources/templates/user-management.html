<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>User Management</title>
    <link rel="stylesheet" th:href="@{/css/dashboard-layout.css}">
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 30px;
            background-color: #1c1c1c;
            border: 2px solid #7a4fca;
            border-radius: 8px;
            overflow: hidden;
        }

        th, td {
            padding: 15px;
            text-align: left;
            color: #d8b9f2;
        }

        th {
            background-color: #7a4fca;
            color: white;
            font-size: 16px;
        }

        tr:nth-child(even) {
            background-color: #222;
        }

        tr:hover {
            background-color: #2d2d2d;
        }

        h1 {
            color: #d8b9f2;
        }

        .promote-btn {
            background-color: #7a4fca;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.3s;
            font-weight: bold;
        }

        .promote-btn:hover {
            background-color: #925eff;
        }
    </style>
</head>
<body>

<!-- Sidebar -->
<div th:replace="fragments/navbar :: navbar"></div>

<!-- Glavni sadržaj -->
<div class="main-content">
    <h1>All Users</h1>

    <table>
        <thead>
        <tr>
            <th>Username</th>
            <th>Email</th>
            <th>Role</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="user : ${users}">
            <td th:text="${user.username}">username</td>
            <td th:text="${user.email}">email</td>
            <td th:text="${user.role}">role</td>
            <td>
                <form th:action="@{'/admin/promote/' + ${user.id}}" method="post"
                      th:if="${user.role.name() == 'USER'}">
                    <button type="submit" class="promote-btn">Promote to CRITIC</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
