<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>My Reviews</title>
    <link rel="stylesheet" th:href="@{/css/dashboard-layout.css}">
</head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>
<div class="main-content">
    <h2>My Reviews</h2>
    <div th:each="review : ${myReviews}" style="margin-bottom: 20px; padding: 15px; border: 1px solid #7a4fca; border-radius: 10px; background-color: #1c1c1c;">
        <h3 th:text="${review.movie.title}"></h3>
        <p><strong>Rating:</strong> <span th:text="${review.rating}"></span>/10</p>
        <p><strong>Text:</strong> <span th:text="${review.reviewText}"></span></p>
        <p><strong>Created at:</strong> <span th:text="${#temporals.format(review.createdAt, 'dd.MM.yyyy. HH:mm')}"></span></p>
    </div>
</div>
</body>
</html>
