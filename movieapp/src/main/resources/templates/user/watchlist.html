<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Watchlist</title>
    <link rel="stylesheet" th:href="@{/css/dashboard-layout.css}">
    <style>
        .movie-card {
            display: flex;
            gap: 20px;
            background-color: #1c1c1c;
            border: 2px solid #7a4fca;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            align-items: center;
        }

        .movie-card img {
            height: 200px;
            border-radius: 6px;
        }

        .movie-details {
            flex: 1;
        }

        .movie-details h2 {
            color: #d8b9f2;
            margin: 0;
        }

        .movie-details p {
            margin: 4px 0;
        }

        .remove-button {
            background-color: #d9534f;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 10px;
        }

        .remove-button:hover {
            background-color: #c9302c;
        }
    </style>
</head>
<body>

<!-- Navigacija -->
<div th:replace="fragments/navbar :: navbar"></div>

<!-- Glavni sadržaj -->
<div class="main-content">
    <h1>My watchlist</h1>

    <div th:if="${watchlist.isEmpty()}">
        <p>You have no movies in your watchlist.</p>
    </div>

    <div th:each="movie : ${watchlist}" class="movie-card">
        <img th:src="${movie.posterUrl}" alt="Poster" />
        <div class="movie-details">
            <h2 th:text="${movie.title}">Title</h2>
            <p><strong>Genre:</strong> <span th:text="${movie.genre}"></span></p>
            <p><strong>Director:</strong> <span th:text="${movie.director}"></span></p>
            <p><strong>Release Year:</strong> <span th:text="${movie.releaseYear}"></span></p>

            <form th:action="@{'/watchlist/remove/' + ${movie.id}}" method="post">
                <button type="submit" class="remove-button">Remove</button>

            </form>

        </div>
    </div>
</div>

</body>
</html>
